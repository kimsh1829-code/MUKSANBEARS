<style>
:root{
  --bg:#F4F5F0; --panel:#FFFFFF; --ink:#1B1D1A; --muted:#626860; --chip:#E9ECE4; --rule:#DADED4;
  --sign:#F5BE0B; --sign-ink:#1B1D1A; --red:#D7362B; --green:#03A94D; --focus:#2D6CDF;
  --display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141613; --panel:#1D201B; --ink:#EDEFE9; --muted:#A2A89E; --chip:#2A2E27; --rule:#30352D;
  --red:#FF5E4D; --focus:#7FA8FF; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

.app{display:flex;flex-direction:column;height:100%}
header{background:var(--sign);color:var(--sign-ink);padding-top:env(safe-area-inset-top)}
header .in{padding-block:12px 10px;display:flex;align-items:center;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,5vw,32px);line-height:1.1;margin:0}
.titlebox{flex:1;min-width:0}
.count{font-size:12.5px;font-weight:500;opacity:.8}
.addbtn{background:var(--sign-ink);color:#FFF8DD;border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--rule);scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{flex:1;min-height:0;display:grid;grid-template-rows:48% 1fr}
#map{min-height:0;background:#e5e3df}
.list{overflow-y:auto;background:var(--panel);border-top:1px solid var(--rule);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@media (min-width:860px){main{grid-template-rows:none;grid-template-columns:1fr 400px}.list{border-top:0;border-left:1px solid var(--rule)}}
.mode{margin:10px 0 0;padding:8px 12px;border-radius:8px;background:var(--chip);font-size:12.5px;color:var(--muted)}
.mode[hidden]{display:none}
ul.places{list-style:none;margin:0;padding:0}
.place{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.place.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--sign) 22%,transparent),transparent)}
.pname{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.pnote{font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.stars{color:#E0A800;letter-spacing:1px}
.tag{font-size:11.5px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 5px;color:var(--red)}
.tag.soft{color:var(--muted);border-style:dashed;font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn.nv{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.empty{padding:24px 0;color:var(--muted);font-size:14px}
.empty .btn{margin-top:10px}
.listhead{display:flex;justify-content:space-between;align-items:baseline;padding-block:12px 2px}
.listhead h2{font-size:13px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.04em}

.badge{display:grid;place-items:center;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:13px;width:34px;height:34px}
.pin{width:30px;height:30px;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pin.sel{transform:scale(1.3);border-color:var(--sign)}
.pin.approx{border-style:dashed}
.leaflet-container{font-family:var(--body)}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.45;min-width:190px}
.pop h3{margin:0 0 2px;font-size:16px}

.pickbar{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:1500;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px}
.pickbar span{flex:1}
.pickbar button{background:var(--sign);color:var(--sign-ink);border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
.pickbar button.sec{background:var(--bg);color:var(--ink);font-weight:400}

.overlay{position:fixed;inset:0;z-index:2000;background:rgba(10,12,9,.45);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--panel);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@media (min-width:860px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 10px}
form{display:flex;flex-direction:column;gap:11px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
input,select,textarea{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:9px 10px;font-weight:400;color:var(--ink);font-size:16px;min-width:0;width:100%}
textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;flex-direction:column;gap:6px}
.pastebtn{background:var(--sign);color:var(--sign-ink);border:0;border-radius:10px;padding:14px;font-weight:700;font-size:16px;cursor:pointer}
.preview{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--bg)}
.pv-name{font-weight:700;font-size:17px}
.pv-sub{font-size:13px;color:var(--muted)}
details#more{border-top:1px solid var(--rule);padding-top:8px}
details#more summary{cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:500;padding:4px 0}
.morebody{display:flex;flex-direction:column;gap:11px;margin-top:8px}
.hint{font-weight:400;font-size:12.5px;color:var(--muted)}
.hint.ok{color:var(--green)}.hint.warn{color:var(--red)}
.rating{display:flex;gap:2px}
.rating button{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--rule);padding:0 2px}
.rating button.on{color:#E0A800}
.loc{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px dashed var(--rule);border-radius:8px;padding:9px 10px;font-size:14px}
.loc .none{color:var(--red);font-weight:500}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions .sp{flex:1}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:11px 20px;font-weight:700;cursor:pointer}
.primary:disabled{opacity:.5}
.ghost{background:none;border:1px solid var(--rule);border-radius:8px;padding:11px 14px;cursor:pointer}
.danger{background:none;border:0;color:var(--red);padding:10px 4px;cursor:pointer}
.err{color:var(--red);font-size:13px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:3000}
.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
  <header><div class="in gut">
    <div class="titlebox"><h1>먹산을 위한 맛집지도</h1><div class="count" id="count">불러오는 중…</div></div>
    <button class="addbtn" id="addBtn" type="button">＋ 맛집 추가</button>
  </div></header>
  <nav class="chips gut" id="chips" aria-label="종류별 보기"></nav>
  <main>
    <div id="map" aria-label="맛집 지도"></div>
    <section class="list gut" aria-label="맛집 목록">
      <p class="mode" id="mode" hidden></p>
      <div class="listhead"><h2 id="listTitle">전체 맛집</h2></div>
      <ul class="places" id="places"></ul>
      <div class="empty" id="empty" hidden></div>
    </section>
  </main>
</div>

<div class="pickbar" id="pickbar" hidden><span id="pickText">지도를 눌러 위치를 정하세요</span><button type="button" class="sec" id="pickCancel">취소</button><button type="button" id="pickDone" hidden>여기로</button></div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <h2 id="formTitle">맛집 추가</h2>
    <form id="form" novalidate>
      <div class="quick" id="quick">
        <button type="button" class="pastebtn" id="fClip">📋 복사한 내용 붙여넣기</button>
        <textarea id="fPaste" rows="2" aria-label="네이버지도 공유 내용" placeholder="또는 여기에 길게 눌러 붙여넣기"></textarea>
        <span class="hint" id="fPasteMsg">네이버지도 앱에서 가게 → 공유 → <b>복사</b>, 또는 카톡방에 올라온 네이버지도 메시지를 길게 눌러 <b>복사</b>한 뒤 위 버튼을 누르세요.</span>
      </div>
      <div class="preview" id="fPreview" hidden><div class="pv-name" id="pvName"></div><div class="pv-sub" id="pvSub"></div></div>
      <div class="loc"><span id="fLoc"></span><button type="button" class="btn" id="fPick">지도에서 찍기</button></div>
      <details id="more"><summary>직접 입력·수정 (이름, 주소, 종류, 메뉴, 별점)</summary>
      <div class="morebody">
      <label>가게 이름 *<input id="fName" maxlength="60" autocomplete="off"></label>
      <label>주소<input id="fAddr" maxlength="120" autocomplete="off" placeholder="예) 서울 용산구 한강대로62나길 24"></label>
      <div class="row">
        <label>종류<select id="fCat"></select></label>
        <label>대표 메뉴<input id="fMenu" maxlength="60" placeholder="예) 차돌박이"></label>
      </div>
      <label>한줄평<textarea id="fNote" rows="2" maxlength="200" placeholder="예) 2차로 딱. 웨이팅 각오"></textarea></label>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div><div style="font-size:13px;font-weight:700;color:var(--muted)">별점</div><div class="rating" id="fRating"></div></div>
        <label style="flex:1;min-width:140px">올린 사람<input id="fAuthor" maxlength="20" placeholder="닉네임"></label>
      </div>
      <label>네이버지도 링크<input id="fLink" maxlength="300" inputmode="url" placeholder="https://naver.me/..."></label>
      </div></details>
      <p class="err" id="fErr"></p>
      <div class="actions">
        <button type="button" class="danger" id="fDel" hidden>삭제</button>
        <span class="sp"></span>
        <button type="button" class="ghost" id="fCancel">취소</button>
        <button type="submit" class="primary" id="fSave">저장</button>
      </div>
    </form>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

/* ---------- 네이버 연결 ---------- */
function naverPlaceUrl(p){if(/^https:\/\//.test(p.link||""))return p.link;const area=(p.addr||"").split(/\s+/).slice(0,2).join(" ");return "https://map.naver.com/p/search/"+encodeURIComponent((area?area+" ":"")+p.name)}
function naverRouteUrl(p){
  if(!hasLoc(p))return naverPlaceUrl(p);
  if(isMobile)return `nmap://route/public?dlat=${p.lat}&dlng=${p.lng}&dname=${encodeURIComponent(p.name)}&appname=${encodeURIComponent(location.hostname||"mukmap")}`;
  return `https://map.naver.com/p/directions/-/${p.lng},${p.lat},${encodeURIComponent(p.name)},,/-/transit`;
}
function openRoute(p,ev){
  if(!isMobile||!hasLoc(p))return; // 데스크톱은 기본 링크 동작
  ev.preventDefault();
  const start=Date.now();location.href=naverRouteUrl(p);
  setTimeout(()=>{if(document.visibilityState==="visible"&&Date.now()-start<2500)location.href=`https://m.map.naver.com/route.nhn?menu=route&ename=${encodeURIComponent(p.name)}&ex=${p.lng}&ey=${p.lat}&pathType=1&showMap=true`},1500);
}
function routeLink(p){const a=el("a","btn nv","네이버 길찾기");a.href=naverRouteUrl(p);a.target="_blank";a.rel="noopener";a.onclick=ev=>{ev.stopPropagation();openRoute(p,ev)};return a}
function placeLink(p){const a=el("a","btn",/kakao/.test(p.link||"")?"카카오맵 ↗":"네이버지도 ↗");a.href=naverPlaceUrl(p);a.target="_blank";a.rel="noopener";a.onclick=ev=>ev.stopPropagation();return a}

function pinIcon(p,sel){const c=cat(p.cat);return L.divIcon({className:"",html:`<span class="badge pin${p.approx?" approx":""}${sel?" sel":""}" style="--c:${c.c}">${c.s}</span>`,iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-16]})}

    if(!hasLoc(p))m.append(el("span","tag","위치 미정"));else if(p.approx)m.append(el("span","tag soft","대략 위치"));
    if(p.author)m.append(el("span",null,"by "+p.author));
    mid.append(m);if(p.note)mid.append(el("div","pnote",p.note));

    if(!hasLoc(p)||p.approx){const x=el("button","btn",hasLoc(p)?"위치 바로잡기":"지도에 찍기");x.type="button";x.onclick=ev=>{ev.stopPropagation();form=toForm(p);formWasOpen=false;startPick()};bt.append(x)}
    const e=el("button","btn","수정");e.type="button";e.onclick=ev=>{ev.stopPropagation();openForm(p)};bt.append(e);
    mid.append(bt);li.append(mid);

    li.onclick=go;li.onkeydown=ev=>{if(ev.key==="Enter"&&ev.target===li)go()};

function select(id,fly){
  selId=id;
  document.querySelectorAll(".place").forEach(li=>li.classList.toggle("sel",li.dataset.id===id));
  Object.entries(markers).forEach(([k,m])=>m.setIcon(pinIcon(places.find(x=>x.id===k),k===id)));
  const m=markers[id];if(!m)return;
  if(fly){
    if(window.innerWidth<860)$("map").scrollIntoView({block:"nearest"});
    map.flyTo(m.getLatLng(),Math.max(map.getZoom(),16),{duration:.7});
    map.once("moveend",()=>m.openPopup());
  }else{const li=document.querySelector(`.place[data-id="${CSS.escape(id)}"]`);li&&li.scrollIntoView({block:"nearest",behavior:"smooth"})}
}

/* ---------- 주소 → 좌표 (OpenStreetMap Nominatim) ---------- */
const geoCache=ls.get("mukmap-geo",{});
let lastGeo=0;
async function nominatim(q){
  if(geoCache[q]!==undefined)return geoCache[q];
  const wait=Math.max(0,1100-(Date.now()-lastGeo));if(wait)await new Promise(r=>setTimeout(r,wait));lastGeo=Date.now();
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q="+encodeURIComponent(q));
    const j=await r.json();const v=j[0]?{lat:+(+j[0].lat).toFixed(6),lng:+(+j[0].lon).toFixed(6)}:null;
    geoCache[q]=v;ls.set("mukmap-geo",geoCache);return v;
  }catch{return null}
}
function cleanAddr(a){return a.replace(/\s+\d+층.*$/,"").replace(/\s*\(.*\)\s*$/,"").replace(/,.*$/,"").trim()}
async function geocode(addr,name){
  if(!addr&&!name)return null;
  const a=cleanAddr(addr||"");
  if(a){const r=await nominatim(a);if(r)return {...r,approx:false}}
  const parts=a.split(/\s+/);
  if(name&&parts.length>=2){const r=await nominatim(name+" "+parts.slice(0,2).join(" "));if(r)return {...r,approx:false}}
  if(parts.length>=3){const r=await nominatim(parts.slice(0,3).join(" "));if(r)return {...r,approx:true}}
  if(parts.length>=2){const r=await nominatim(parts.slice(0,2).join(" "));if(r)return {...r,approx:true}}
  return null;
}
const ADDR_RE=/^(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|충청|전북|전남|전라|경북|경남|경상|제주)/;
function parseShare(t){
  t=t.replace(/\[([^\]]*)\]\((https?:[^)\s]+)\)/g,"$2"); // 마크다운 링크 정리
  let url=(t.match(/https?:\/\/[^\s)]+/)||[])[0]||"";
  const lines=t.split(/\n/).map(s=>s.trim()).filter(s=>s&&!/^\[?\s*네이버\s*지도\s*\]?$/.test(s)&&!/^https?:\/\//.test(s)&&!/^(장소|place)\s*-\s*(네이버지도|카카오맵)$/i.test(s));
  const addr=lines.find(s=>ADDR_RE.test(s))||"";
  let lat=null,lng=null,src="";
  if(/map\.naver\.com/.test(url)){src="naver";
    const la=url.match(/[?&]lat=([\d.]+)/),ln=url.match(/[?&]lng=([\d.]+)/);if(la&&ln){lat=+(+la[1]).toFixed(6);lng=+(+ln[1]).toFixed(6)}
    const id=url.match(/place\/(\d+)/);if(id)url="https://map.naver.com/p/entry/place/"+id[1];}
  else if(/place\.map\.kakao\.com\/(\d+)/.test(url)){src="kakao";url="https://place.map.kakao.com/"+url.match(/place\.map\.kakao\.com\/(\d+)/)[1]}
  else if(/naver\.me/.test(url))src="naver";
  return {url,addr,name:lines.find(s=>s!==addr)||"",lat,lng,src};
}
async function reverseArea(lat,lng){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ko&zoom=16`);const j=await r.json();const a=j.address||{};
    return [a.province||a.state,a.city||a.county,a.borough||a.city_district,a.suburb||a.quarter||a.town||a.village].filter(Boolean).filter((v,i,arr)=>arr.indexOf(v)===i).join(" ")}catch{return ""}
}

/* ---------- 저장소: Firebase 또는 이 기기 ---------- */
async function initStore(){
  const cfg=window.FIREBASE_CONFIG;
  if(cfg&&cfg.apiKey){
    try{
      const V="10.12.5",base=`https://www.gstatic.com/firebasejs/${V}/`;
      const [{initializeApp},{getFirestore,collection,doc,onSnapshot,addDoc,updateDoc,deleteDoc},{getAuth,signInAnonymously,onAuthStateChanged}]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-firestore.js"),import(base+"firebase-auth.js")]);
      const app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app);
      const uid=await new Promise((res,rej)=>{onAuthStateChanged(auth,u=>{if(u)res(u.uid)});signInAnonymously(auth).catch(rej)});
      const col=collection(db,"places");
      onSnapshot(col,s=>{places=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render()},e=>{showMode("공유 지도를 불러오지 못했어요: "+e.code)});
      return {shared:true,uid,
        add:d=>addDoc(col,{...d,uid}),
        update:(id,d)=>updateDoc(doc(db,"places",id),d),
        remove:id=>deleteDoc(doc(db,"places",id)),
        canDelete:p=>p.uid===uid};
    }catch(e){console.error(e);showMode("Firebase 연결에 실패해서 이 기기에만 저장하는 모드로 열렸어요. 설정을 확인해 주세요.")}
  }else showMode("지금은 이 기기에만 저장돼요. Firebase를 연결하면 친구들과 함께 쓸 수 있어요.");
  const KEY="mukmap-local";
  const save=()=>{ls.set(KEY,places);render()};
  places=ls.get(KEY,[]);render();
  return {shared:false,
    add:async d=>{places.unshift({...d,id:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)});save()},
    update:async(id,d)=>{places=places.map(p=>p.id===id?{...p,...d}:p);save()},
    remove:async id=>{places=places.filter(p=>p.id!==id);save()},
    canDelete:()=>true};
}
function showMode(t){const m=$("mode");m.textContent=t;m.hidden=false}

let seeding=false;
async function seed(){
  if(seeding)return;seeding=true;let i=0;
  for(const s of SEED){
    i++;toast(`기본 맛집 넣는 중… ${i}/${SEED.length}`);
    const g=await geocode(s.addr,s.name);
    const d={name:s.name,cat:s.cat,menu:s.menu||"",note:s.note||"",rating:0,link:s.link||"",addr:s.addr||"",author:"곰슐랭",
      lat:g?g.lat:null,lng:g?g.lng:null,approx:g?g.approx:false,createdAt:Date.now()-i*1000,updatedAt:Date.now()};
    try{await store.add(d)}catch(e){toast("저장 실패: "+(e.code||e.message));break}
  }
  seeding=false;toast("기본 맛집을 넣었어요");
}

function guessCat(n){
  const t=n||"";
  if(/베이커리|제빵|빵|베이글|카페|커피|디저트|케이크|도넛|마카롱|파블로바|소금빵|coffee|cafe|bakery/i.test(t))return "카페·디저트";
  if(/고기|갈비|삼겹|정육|한우|곱창|막창|차돌|숯불|돼지|소고기|BBQ/i.test(t))return "고기";
  if(/스시|초밥|라멘|우동|돈카츠|돈까스|이자카야|오마카세|소바|텐동|고로케/.test(t))return "일식";
  if(/중국|짜장|짬뽕|마라|양꼬치|딤섬|반점|훠궈/.test(t))return "중식";
  if(/쌀국수|베트남|태국|팟타이|인도|커리|분짜/.test(t))return "아시안";
  if(/파스타|피자|버거|스테이크|브런치|비스트로|트라토리아/.test(t))return "양식";
  if(/떡볶이|김밥|분식|순대/.test(t))return "분식";
  if(/포차|술집|주점|호프|와인바|바$|펍/.test(t))return "술집";
  if(/국밥|탕|찌개|국수|칼국수|냉면|순두부|백반|한정식|해장|곰탕|밀면|막국수|횟집|회|대구|청국장|감자/.test(t))return "한식";
  return "미분류";
}

  const g=await geocode(form.addr,form.name);if(!form)return;
  const m=$("fPasteMsg");
  if(g){Object.assign(form,g);paintLoc();m.className="hint ok";m.textContent=g.approx?"동네까지만 찾았어요. 그대로 ‘추가’를 눌러도 되고, 나중에 핀을 옮겨도 돼요.":"위치까지 찾았어요. 이대로 ‘추가’를 누르면 끝이에요."}
  else{m.className="hint warn";m.textContent="주소로 위치를 못 찾았어요. ‘지도에서 찍기’로 직접 정해주세요."}
}
$("fClip").onclick=async()=>{
  try{const t=await navigator.clipboard.readText();if(!t||!t.trim()){toast("복사한 내용이 없어요");return}$("fPaste").value=t;$("fPaste").dispatchEvent(new Event("input"))}
  catch{toast("붙여넣기 권한이 없어요. 아래 칸을 길게 눌러 붙여넣어 주세요");$("fPaste").focus()}
};
$("fPaste").addEventListener("input",async()=>{
  const t=$("fPaste").value;if(!t.trim())return;readForm();
  const r=parseShare(t);if(r.name)form.name=r.name;if(r.addr)form.addr=r.addr;if(r.url)form.link=r.url;
  if(r.name&&form.cat==="미분류")form.cat=guessCat(r.name);
  $("more").dataset.keep=r.name?"":"1";
  openForm();delete $("more").dataset.keep;
  if(!r.name&&!r.addr&&r.url){
    const m=$("fPasteMsg");
    if(r.lat!=null){form.lat=r.lat;form.lng=r.lng;form.approx=false;form.addr=await reverseArea(r.lat,r.lng);paintLoc();paintPreview();
      m.className="hint ok";m.textContent="링크에서 정확한 위치를 찾았어요. 이름은 링크에 안 들어 있어서 ‘이름 미정’으로 올라가요. 그대로 ‘추가’를 누르면 돼요.";}
    else{m.className="hint";m.textContent="링크로 추가할게요. 이 링크엔 위치 정보가 없어서 ‘위치 미정’으로 올라가요. 그대로 ‘추가’를 누르면 돼요.";paintPreview();}
    return}
  if(!r.addr){const m=$("fPasteMsg");m.className="hint warn";m.textContent="주소가 없어서 위치를 찾을 수 없어요. 공유 내용을 통째로 붙여넣거나 ‘지도에서 찍기’를 써주세요.";return}
  form.lat=form.lng=null;await locate();
});
$("fAddr").addEventListener("change",async()=>{readForm();if(form.addr.trim()&&(!hasLoc(form)||form.approx))await locate()});
let delArmed=false;
$("fDel").onclick=async()=>{if(!delArmed){delArmed=true;$("fDel").textContent="한 번 더 누르면 삭제";return}
  try{await store.remove(form.id);closeForm();toast("삭제했어요")}catch(e){$("fErr").textContent="삭제하지 못했어요. 올린 사람만 지울 수 있어요."}};
$("form").addEventListener("submit",async e=>{
  e.preventDefault();readForm();
  if(!form.name.trim()&&form.link)form.name="이름 미정 장소";
  const name=form.name.trim();if(!name){$("fErr").textContent="가게 이름이 비어 있어요. 공유 내용을 붙여넣거나 ‘직접 입력’에서 이름을 적어주세요.";$("more").open=true;return}
  const link=form.link.trim();if(link&&!/^https:\/\//.test(link)){$("fErr").textContent="링크는 https:// 로 시작해야 해요.";return}
  if(form.author.trim())ls.set("mukmap-nick",form.author.trim());
  const d={name,cat:form.cat,menu:form.menu.trim(),note:form.note.trim(),rating:form.rating||0,link,addr:form.addr.trim(),author:form.author.trim(),lat:hasLoc(form)?form.lat:null,lng:hasLoc(form)?form.lng:null,approx:!!form.approx,updatedAt:Date.now()};
  $("fSave").disabled=true;
  try{if(form.id)await store.update(form.id,d);else await store.add({...d,createdAt:Date.now()});const n=!form.id;closeForm();toast(n?"추가했어요":"저장했어요")}
  catch(err){$("fErr").textContent="저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요."}
  finally{$("fSave").disabled=false}
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(picking)$("pickCancel").click();else if(!$("overlay").hidden)closeForm()});
let tt;function toast(t){const x=$("toast");x.textContent=t;x.hidden=false;clearTimeout(tt);tt=setTimeout(()=>x.hidden=true,2400)}

store=await initStore();
</script>
</body>
</html>
